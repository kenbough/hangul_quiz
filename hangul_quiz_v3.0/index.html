<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>한글 퀴즈 | ハングル学習クイズ</title>

<!-- Home screen / PWA setup (iOS + general) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#171717">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root{
    --bg:#FAFAF7;
    --stage:#FAFAF7;
    --paper:#FAFAF7;
    --ink:#171717;
    --ink-soft:#4F4F4F;
    --muted:#858585;
    --line:#8A8A84;
    --line-light:#D7D7D1;
    --success:#376149;
    --success-soft:#EEF4F0;
    --danger:#9B4945;
    --danger-soft:#F8EFEE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    color:var(--ink);
    font-family:"Gen Interface JP",sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    text-rendering:geometricPrecision;
    background:var(--bg);
  }
  .kr{font-family:'Noto Sans KR',sans-serif;}
  #app{max-width:980px;margin:0 auto;padding:40px 24px 80px;}

  /* shell */
  .save-error-banner{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;background:var(--danger-soft);color:var(--danger);border:1px solid rgba(155,73,69,.22);padding:12px 14px;font-size:12px;line-height:1.7;margin:0 28px 16px;}
  .save-error-banner button{border:0;background:transparent;color:inherit;cursor:pointer;font:inherit;padding:0;}
  .topbar{position:relative;z-index:2;margin-left:28px;margin-bottom:-22px;pointer-events:none;}
  .brand{display:inline-flex;background:var(--stage);padding:0 28px 0 0;}
  .brand .kr-title{font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:36px;line-height:1;letter-spacing:-.045em;}
  .brand .sub{display:none;}

  /* generic */
  .card{background:transparent;border:1px solid var(--line-light);padding:28px;border-radius:6px;}
  .btn{appearance:none;font-family:inherit;font-weight:400;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--line);padding:10px 14px;cursor:pointer;border-radius:4px;transition:background .15s ease,color .15s ease,border-color .15s ease;}
  .btn:hover{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .btn-primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn-primary:hover{background:#343434;border-color:#343434;}
  .btn-primary:disabled{background:#BDBDB7;color:#fff;border-color:#BDBDB7;cursor:not-allowed;}
  .btn-ghost,.btn-danger-ghost{background:transparent;border:0;padding:4px 0;text-decoration:none;font-size:11px;color:var(--ink-soft);cursor:pointer;}
  .btn-danger-ghost{color:var(--ink-soft);}
  .btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .between{display:flex;align-items:center;justify-content:space-between;}
  .eyebrow{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:400;}
  h2.title{font-size:27px;line-height:1.2;letter-spacing:-.03em;margin:0 0 10px;font-weight:400;}
  p.desc{font-size:13px;color:var(--ink-soft);margin:0 0 22px;line-height:1.8;}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);cursor:pointer;text-decoration:none;padding:0;border:0;background:transparent;}
  .back-link:hover{color:var(--ink);}
  .section-topbar{display:flex;justify-content:flex-end;align-items:center;margin-bottom:18px;}

  /* HOME — based on supplied comp */
  .home-stage{background:transparent;padding:112px 28px 78px;min-height:650px;}
  .home-inner{max-width:860px;margin:0 auto;}
  .home-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-bottom:108px;}
  .home-stat{display:grid;grid-template-columns:1fr auto auto;align-items:end;gap:10px;padding:0 8px 10px;border-bottom:1px solid #A6A6A0;min-height:60px;}
  .home-stat-label{font-size:13px;line-height:1.2;color:var(--ink);align-self:end;padding-bottom:3px;}
  .home-stat-number{font-size:42px;line-height:.9;letter-spacing:-.045em;font-variant-numeric:tabular-nums;}
  .home-stat-unit{font-size:12px;line-height:1;color:var(--ink);padding-bottom:3px;min-width:18px;}
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:0;}
  .mode-card{position:relative;display:flex;align-items:center;min-height:156px;background:transparent;border:1px solid #3F3A38;border-radius:6px;padding:30px 34px;cursor:pointer;transition:background .15s ease,border-color .15s ease,color .15s ease;}
  .mode-card:hover{background:#D6D4CF;border-color:#4F4F4C;color:var(--ink);}
  .mode-card:hover .mode-jp,.mode-card:hover .mode-count{color:var(--ink);}
  .mode-row{display:flex;align-items:flex-end;justify-content:space-between;width:100%;}
  .mode-copy{display:flex;flex-direction:column;justify-content:center;}
  .mode-kr{font-family:'Noto Sans KR',sans-serif;font-size:38px;font-weight:400;line-height:1;letter-spacing:-.04em;margin-bottom:18px;}
  .mode-jp{font-size:14px;color:var(--ink);line-height:1;}
  .mode-count{font-size:15px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;}
  .home-tools{display:flex;justify-content:flex-end;align-items:center;gap:18px;margin:16px 0 0;padding:0 4px;font-size:11px;}
  .home-empty-note{font-size:11px;color:var(--muted);margin:18px 0 0;}

  .status-panel{display:none;}
  .stats-row{display:none;}
  .reset-confirm{display:flex;align-items:center;gap:8px;color:var(--danger);font-size:11px;}
  .backup-textarea{width:100%;min-height:110px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.6;padding:12px;border:1px solid var(--line-light);background:#fff;color:var(--ink-soft);resize:vertical;border-radius:4px;}
  .backup-reminder{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#F4F4F1;border:1px solid var(--line-light);padding:12px 14px;margin:18px 0;font-size:12px;color:var(--ink-soft);border-radius:4px;}

  /* manage / selection */
  .manage-shell,.word-shell,.result-shell{background:transparent;padding:54px 44px 52px;}
  .manage-shell .card,.word-shell .card,.result-shell .card{background:transparent;border:0;padding:0;}
  .item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px;margin:24px 0 30px;}
  .item-tile{position:relative;min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid #777773;background:transparent;padding:12px 6px;cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease;border-radius:4px;}
  .item-tile:hover{background:#E7E7E2;}
  .item-tile.checked{background:#D9D8D2;color:var(--ink);border-color:#6D6B66;}
  .item-tile .kr{font-size:27px;font-weight:500;line-height:1;}
  .item-tile .hint{font-size:9px;color:var(--ink-soft);margin-top:7px;}
  .item-tile.checked .hint{color:var(--ink-soft);}
  .item-tile.checked .note{color:var(--danger);}
  .item-tile .note{font-size:8px;color:var(--danger);margin-top:4px;}
  .item-tile .dot{position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:#B7B7B0;}
  .item-tile .dot.weak{background:var(--danger);}
  .item-tile .dot.strong{background:var(--success);}
  .item-tile .check{position:absolute;top:7px;left:9px;font-size:9px;font-weight:400;color:var(--ink);}
  .count-select{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 24px;}
  .count-select button{min-width:50px;}
  .count-select button.active{background:#D9D8D2;color:var(--ink);border-color:#6D6B66;}
  .theme-list{display:flex;flex-direction:column;gap:10px;margin:20px 0 28px;}
  .theme-row{display:flex;align-items:center;gap:14px;border:1px solid var(--line-light);padding:14px 12px;cursor:pointer;border-radius:4px;transition:background .15s ease,border-color .15s ease;}
  .theme-row:first-child{}
  .theme-row .box{width:14px;height:14px;border:1px solid var(--line);flex-shrink:0;}
  .theme-row.checked .box{background:#6D6B66;box-shadow:inset 0 0 0 3px var(--bg);border-color:#6D6B66;}
  .theme-row.checked{background:#D9D8D2;border-color:#6D6B66;}
  .theme-row .label{font-size:14px;flex:1;}
  .theme-row .n{font-size:12px;color:var(--muted);}
  .empty-note{font-size:12px;color:var(--danger);border:1px solid rgba(155,73,69,.3);border-radius:4px;padding:10px 12px;margin:12px 0;}

  /* quiz */
  .quiz-exit-confirm{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--danger);border:1px solid rgba(155,73,69,.3);border-radius:4px;padding:10px 12px;}
  .quiz-exit-actions{display:flex;gap:8px;}
  .quiz-progress{font-size:11px;color:var(--muted);letter-spacing:.08em;margin:10px 0 12px;}
  .quiz-card{background:transparent;padding:68px 28px 58px;text-align:center;border:1px solid var(--line-light);border-radius:6px;min-height:450px;}
  .quiz-card.flash-correct{background:var(--success-soft);}
  .quiz-card.flash-wrong{background:var(--danger-soft);}
  @media (prefers-reduced-motion:no-preference){
    .quiz-card.flash-correct{animation:pulseC .3s ease;}
    .quiz-card.flash-wrong{animation:shakeW .3s ease;}
  }
  @keyframes pulseC{0%{transform:scale(1)}50%{transform:scale(1.012)}100%{transform:scale(1)}}
  @keyframes shakeW{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
  .quiz-kr{font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:88px;line-height:1;letter-spacing:-.05em;word-break:keep-all;}
  .quiz-kr.long{font-size:48px;}
  .quiz-meaning{font-size:13px;color:var(--ink-soft);margin-top:18px;min-height:20px;}
  .answer-input{width:100%;max-width:350px;font-family:"Gen Interface JP",sans-serif;font-size:23px;padding:13px 10px;text-align:center;margin-top:32px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:4px;}
  .answer-input:focus{outline:0;border-color:var(--ink);}
  .answer-input.ans-correct{border-color:var(--success);color:var(--success);}
  .answer-input.ans-wrong{border-color:var(--danger);color:var(--danger);}
  .feedback-line{margin-top:16px;font-size:13px;min-height:18px;}
  .feedback-line.correct{color:var(--success);}
  .feedback-line.wrong{color:var(--danger);}
  .sound-btn{display:block;margin:13px auto 0;border:0;background:transparent;color:var(--ink-soft);font-family:inherit;font-size:11px;cursor:pointer;padding:4px;}
  .quiz-actions{margin-top:30px;display:flex;justify-content:center;gap:10px;}

  /* result */
  .score-hero{text-align:left;padding:0 0 32px;border-bottom:1px solid var(--line);}
  .score-hero .num{font-size:62px;line-height:1;letter-spacing:-.05em;}
  .score-hero .lbl{font-size:11px;color:var(--muted);margin-top:8px;}
  .review-list{display:flex;flex-direction:column;margin:24px 0 28px;border-top:1px solid var(--line-light);}
  .review-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line-light);border-radius:4px;font-size:13px;background:transparent;}
  .review-row.wrong{color:var(--danger);background:var(--danger-soft);border-color:rgba(155,73,69,.25);}
  .review-row .rkr{font-family:'Noto Sans KR',sans-serif;font-size:18px;min-width:76px;}
  .review-row .rmeta{flex:1;color:var(--ink-soft);line-height:1.6;}
  .review-row .rmeta b{color:var(--ink);font-weight:400;}
  .review-row .mark{font-size:14px;}
  .review-sound-btn{border:0;background:transparent;cursor:pointer;font-size:14px;opacity:.55;}
  .footer-actions{display:flex;gap:10px;margin-top:12px;}

  @media(max-width:760px){
    #app{padding:28px 14px 56px;}
    .topbar{margin-left:18px;}
    .brand .kr-title{font-size:31px;}
    .home-stage{padding:96px 18px 54px;}
    .home-stats{gap:16px;margin-bottom:70px;}
    .home-stat{grid-template-columns:1fr auto auto;padding-left:0;padding-right:0;}
    .home-stat-number{font-size:34px;}
    .home-grid{gap:12px;}
    .mode-card{min-height:136px;padding:24px 26px;border-radius:5px;}
    .mode-kr{margin-bottom:14px;font-size:32px;}
    .mode-row{gap:18px;}
    .manage-shell,.word-shell,.result-shell{padding:44px 24px;}
  }
  @media(max-width:560px){
    .home-stats{grid-template-columns:1fr;margin-bottom:56px;gap:16px;}
    .home-stat{min-height:52px;}
    .home-grid{grid-template-columns:1fr;}
    .mode-card{min-height:122px;}
    .home-stage{padding-top:88px;}
    .quiz-card{padding:54px 20px 46px;}
    .quiz-kr{font-size:64px;}
    .quiz-kr.long{font-size:38px;}
  }
</style>
</head>

<script>
/* ============================== DATA ============================== */
const CHO_LIST = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG_LIST = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG_LIST = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function composeHangul(cho, jung, jong){
  const choI = CHO_LIST.indexOf(cho);
  const jungI = JUNG_LIST.indexOf(jung);
  const jongI = JONG_LIST.indexOf(jong || '');
  return String.fromCharCode(0xAC00 + (choI*21 + jungI)*28 + jongI);
}
function decomposeSyllable(ch){
  const code = ch.codePointAt(0) - 0xAC00;
  if(code < 0 || code > 11171) return null; // not a precomposed Hangul syllable (space, punctuation, etc.)
  const jongI = code % 28;
  const jungI = Math.floor(code/28) % 21;
  const choI = Math.floor(code/28/21);
  return {cho:CHO_LIST[choI], jung:JUNG_LIST[jungI], jong:JONG_LIST[jongI]};
}
function decomposeWord(word){
  const out = [];
  for(const ch of word){
    const d = decomposeSyllable(ch);
    if(d) out.push(d);
  }
  return out;
}

 // 挨拶

/* ============================== STORAGE ============================== */
// This standalone version stores one learning record in this browser only.
// No user/profile switching and no external/host storage are used.
const STORAGE_KEY = 'hangul_quiz_progress';
const LEGACY_STORAGE_KEYS = ['progress_p1', 'progress_p2'];

function emptyProgress(){ return {learned:{}, stats:{}, totalTimeMs:0}; }
function normalizeProgress(p){
  if(!p || typeof p !== 'object') return emptyProgress();
  if(!p.learned || typeof p.learned !== 'object') p.learned = {};
  if(!p.stats || typeof p.stats !== 'object') p.stats = {};
  if(typeof p.totalTimeMs !== 'number') p.totalTimeMs = 0;
  return p;
}
function readLocalProgress(key){
  try{
    const raw = window.localStorage.getItem(key);
    return raw ? normalizeProgress(JSON.parse(raw)) : null;
  }catch(e){
    return null;
  }
}
function writeLocalProgress(key, json){
  try{
    window.localStorage.setItem(key, json);
    return true;
  }catch(e){
    return false;
  }
}
async function loadProgress(){
  // Current single-user record.
  const current = readLocalProgress(STORAGE_KEY);
  if(current) return current;

  // One-time migration from the former Ken/Kotoe version.
  // Ken (p1) is preferred because it was the default profile; p2 is used only if p1 is absent.
  for(const legacyKey of LEGACY_STORAGE_KEYS){
    const legacy = readLocalProgress(legacyKey);
    if(legacy){
      writeLocalProgress(STORAGE_KEY, JSON.stringify(legacy));
      return legacy;
    }
  }
  return emptyProgress();
}
async function saveProgress(progress){
  const json = JSON.stringify(normalizeProgress(progress));
  const saved = writeLocalProgress(STORAGE_KEY, json);

  if(saved){
    if(state.saveError){ state.saveError = false; state.saveErrorDismissed = false; render(); }
    return true;
  }

  const wasAlreadyShown = state.saveError;
  state.saveError = true;
  if(!wasAlreadyShown) render();
  return false;
}
// Debounced save for high-frequency interactions such as tapping many checkboxes.
let saveTimer = null;
function scheduleSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ saveTimer = null; saveProgress(state.progress); }, 600);
}
function flushSave(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; saveProgress(state.progress); }
}

/* ============================== STATE ============================== */
let state = {
  progress: null,
  screen: 'loading',
  category: null,
  wordSelectedThemes: null,
  quiz: null,
  countChoice: {},
  formatChoice: {},
  lastQuizType: null,
  lastQuizCategory: null,
  confirmingReset: false,
  saveError: false,
  saveErrorDismissed: false,
  showBackup: false,
  confirmingRestore: false,
};

async function init(){
  state.progress = await loadProgress();
  state.screen = 'home';
  render();
}

async function resetProgress(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
  state.progress = emptyProgress();
  await saveProgress(state.progress);
  state.confirmingReset = false;
  render();
}

function toggleBackupPanel(){
  state.showBackup = !state.showBackup;
  state.confirmingRestore = false;
  render();
}
async function copyBackupText(){
  const ta = document.getElementById('backupExport');
  const fb = document.getElementById('copyFeedback');
  if(!ta) return;
  try{
    await navigator.clipboard.writeText(ta.value);
    if(fb) fb.textContent = 'コピーしました';
  }catch(e){
    ta.focus(); ta.select();
    if(fb) fb.textContent = '選択したので Cmd/Ctrl+C でコピーしてください';
  }
}
async function quickCopyBackup(){
  const btn = document.getElementById('btnQuickBackup');
  const text = JSON.stringify(state.progress, null, 2);
  try{
    await navigator.clipboard.writeText(text);
    if(btn){ btn.textContent = 'コピーしました ✓'; }
  }catch(e){
    // clipboard API unavailable here — fall back to the full backup panel where
    // the text is shown in a selectable textarea.
    state.showBackup = true;
    state.screen = 'home';
    render();
  }
}
let pendingRestore = null;
function requestRestore(){
  const ta = document.getElementById('restoreInput');
  const errEl = document.getElementById('restoreError');
  if(errEl) errEl.textContent = '';
  const raw = ta ? ta.value.trim() : '';
  if(!raw){ if(errEl) errEl.textContent = 'テキストを貼り付けてください。'; return; }
  try{
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== 'object' || !parsed.learned || !parsed.stats){
      if(errEl) errEl.textContent = '正しいバックアップ形式ではないようです。';
      return;
    }
    pendingRestore = parsed;
    state.confirmingRestore = true;
    render();
  }catch(e){
    if(errEl) errEl.textContent = '読み込めませんでした。コピーした内容をそのまま貼り付けてください。';
  }
}
async function confirmRestore(){
  if(!pendingRestore) return;
  if(typeof pendingRestore.totalTimeMs !== 'number') pendingRestore.totalTimeMs = 0;
  state.progress = pendingRestore;
  pendingRestore = null;
  state.confirmingRestore = false;
  await saveProgress(state.progress);
  render();
}
function cancelRestore(){
  state.confirmingRestore = false;
  pendingRestore = null;
  render();
}

/* ============================== HELPERS ============================== */
function norm(s){ return (s||'').toString().trim().toLowerCase().replace(/[\s\-']/g,''); }
function isCorrectAnswer(acceptList, input){
  const u = norm(input);
  if(!u) return false;
  return acceptList.some(r => norm(r) === u);
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function weightFor(stats, id){
  const s = stats[id];
  if(!s) return 1.4;
  const w = 1 + (s.wrong||0)*2 - (s.correct||0)*0.25;
  return Math.max(w, 0.3);
}
function weightedPick(items, stats, n){
  const keyed = items.map(it => ({it, key: Math.pow(Math.random(), 1/weightFor(stats, it.id))}));
  keyed.sort((a,b)=>b.key-a.key);
  return shuffle(keyed.slice(0, Math.min(n, keyed.length)).map(k=>k.it));
}
function learnedCount(catKey){
  const meta = CATEGORY_META[catKey];
  return meta.items.filter(it => state.progress.learned[it.id]).length;
}
function aggregateStats(progress){
  let correct = 0, wrong = 0;
  Object.values(progress.stats).forEach(s=>{ correct += s.correct||0; wrong += s.wrong||0; });
  const total = correct + wrong;
  return {total, correct, wrong, rate: total>0 ? Math.round((correct/total)*100) : null};
}
function formatDuration(ms){
  ms = ms || 0;
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  if(h>0) return `${h}時間${m}分`;
  if(m>0) return `${m}分`;
  return `${s}秒`;
}
function finishQuizSession(quiz){
  quiz.answers.forEach(a=>{
    (a.statIds || []).forEach(id=>{
      const st = state.progress.stats;
      if(!st[id]) st[id] = {correct:0, wrong:0};
      if(a.correct) st[id].correct++; else st[id].wrong++;
    });
  });
  const elapsed = Date.now() - (quiz.startTime || Date.now());
  state.progress.totalTimeMs = (state.progress.totalTimeMs || 0) + elapsed;
  saveProgress(state.progress);
}
function speakKorean(text){
  try{
    if(!('speechSynthesis' in window) || !text) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }catch(e){ /* no Korean voice available or speech unsupported — fail silently */ }
}

/* ============================== QUIZ FLOW ============================== */
// Finds real words (from WORDS + EXTRA_WORDS) that can be fully read using only
// the checked letters in `checkedItems` for the given category.
//  - vowel:     every syllable must be silent-ㅇ + a checked vowel, no batchim.
//  - consonant: every syllable's initial must be a checked consonant OR silent-ㅇ
//               (ㅇ is a free pass since it tests nothing); at least one syllable
//               must actually use a checked consonant.
//  - batchim:   every syllable's final must be a checked batchim OR have no batchim
//               (free pass); at least one syllable must actually use a checked batchim.
function buildWordCandidates(cat, checkedItems){
  const checkedIds = new Set(checkedItems.map(it=>it.id));
  const rawPool = WORDS.concat(EXTRA_WORDS, CONSONANT_EXTRA_WORDS);
  // The same Korean word may exist in a theme list and in the letter-practice list.
  // De-duplicate by spelling so it is never over-represented in a quiz.
  const seenWords = new Set();
  const pool = rawPool.filter(w=>{
    if(seenWords.has(w.kr)) return false;
    seenWords.add(w.kr);
    return true;
  });
  const matches = [];
  pool.forEach(w=>{
    const syll = decomposeWord(w.kr);
    if(syll.length===0) return;
    let ok = true;
    let anyChecked = false;
    const usedIds = new Set();

    if(cat === 'vowel'){
      for(const s of syll){
        if(s.cho !== 'ㅇ' || s.jong !== ''){ ok=false; break; }
        const vItem = VOWELS.find(v=>v.kr===s.jung);
        if(!vItem || !checkedIds.has(vItem.id)){ ok=false; break; }
        usedIds.add(vItem.id);
      }
      anyChecked = usedIds.size>0;
    } else if(cat === 'consonant'){
      for(const s of syll){
        if(s.jong !== ''){ ok=false; break; } // keep this mode purely initial-consonant + vowel, no batchim
        if(s.cho === 'ㅇ'){
          if(checkedIds.has('c_ng')){ usedIds.add('c_ng'); anyChecked = true; }
          continue; // silent either way — free pass if ㅇ itself isn't checked
        }
        const cItem = CONSONANTS.find(c=>c.kr===s.cho);
        if(!cItem || !checkedIds.has(cItem.id)){ ok=false; break; }
        usedIds.add(cItem.id);
        anyChecked = true;
      }
    } else { // batchim
      for(const s of syll){
        if(s.jong === '') continue; // no batchim, free pass
        const jItem = BATCHIM_JAMO.find(j=>j.jong===s.jong);
        if(!jItem || !checkedIds.has(jItem.id)){ ok=false; break; }
        usedIds.add(jItem.id);
        anyChecked = true;
      }
    }

    if(ok && anyChecked){
      matches.push({kr:w.kr, accept:w.roman, meaning:w.meaning, note:null, statIds:Array.from(usedIds), coverage:usedIds.size});
    }
  });
  return matches;
}

// For multi-consonant study, put words that actually combine more of the checked
// consonants near the front of the session. Simpler words still remain in the pool.
function pickLetterWordPool(matches, cat, checkedItems, maxCount){
  if(cat !== 'consonant' || checkedItems.length <= 1){
    return shuffle(matches).slice(0, Math.min(maxCount, matches.length));
  }

  const buckets = new Map();
  matches.forEach(w=>{
    const n = Math.max(1, (w.statIds || []).length);
    if(!buckets.has(n)) buckets.set(n, []);
    buckets.get(n).push(w);
  });

  const ordered = [];
  const maxCoverage = Math.max(...Array.from(buckets.keys()));
  for(let n=maxCoverage; n>=1; n--){
    if(buckets.has(n)) ordered.push(...shuffle(buckets.get(n)));
  }
  return ordered.slice(0, Math.min(maxCount, ordered.length));
}

function startCharacterQuiz(cat){
  const meta = CATEGORY_META[cat];
  const learnedItems = meta.items.filter(it => state.progress.learned[it.id]);
  if(learnedItems.length===0) return;
  const format = state.formatChoice[cat] || 'char';

  let pool;
  if(format === 'word'){
    const matches = buildWordCandidates(cat, learnedItems);
    if(matches.length===0) return;
    // A slightly longer word session makes the larger vocabulary pool useful.
    // With multiple consonants selected, combination words are deliberately prioritized.
    const maxWordCount = cat === 'consonant' ? 30 : 20;
    pool = pickLetterWordPool(matches, cat, learnedItems, maxWordCount);
  } else {
    // Build the full candidate pool of possible questions first, THEN sample from it.
    // (Sampling checked items directly under-produces: 1 consonant checked would
    // otherwise mean only 1 possible question, however many were requested.)
    let candidates = [];
    if(cat === 'vowel'){
      candidates = learnedItems.map(it => ({
        id: it.id, kr: it.kr, accept: it.roman, meaning: null, note: it.note || null, statIds:[it.id]
      }));
    } else if(cat === 'consonant'){
      learnedItems.forEach(c=>{
        VOWELS.forEach(v=>{
          const kr = composeHangul(c.kr, v.kr, '');
          const accept = [];
          c.syn.forEach(ci=>{ v.roman.forEach(vi=>{ const s = ci+vi; if(!accept.includes(s)) accept.push(s); }); });
          candidates.push({id:c.id, kr, accept, meaning:null, note:c.note||null, statIds:[c.id]});
        });
      });
    } else { // batchim
      learnedItems.forEach(j=>{
        CONSONANTS.forEach(c=>{
          VOWELS.forEach(v=>{
            const kr = composeHangul(c.kr, v.kr, j.jong);
            const accept = [];
            c.syn.forEach(ci=>{ v.roman.forEach(vi=>{ const s = ci+vi+j.roman; if(!accept.includes(s)) accept.push(s); }); });
            candidates.push({id:j.id, kr, accept, meaning:null, note:null, statIds:[j.id]});
          });
        });
      });
    }
    // Show the full set for thorough coverage rather than an arbitrary fixed count.
    // Consonant/batchim pools can get very large when several letters are checked
    // at once, so cap those to keep a single session reasonable; vowel naturally
    // tops out at 21 so no cap is needed there.
    let maxCount;
    if(cat === 'vowel') maxCount = candidates.length;
    else if(cat === 'consonant') maxCount = Math.min(candidates.length, 40);
    else maxCount = Math.min(candidates.length, 25); // batchim: cho×jung explodes fast
    pool = weightedPick(candidates, state.progress.stats, maxCount);
  }

  state.lastQuizType = 'character';
  state.lastQuizCategory = cat;
  launchQuiz(pool);
}
function startWordQuiz(){
  const items = WORDS.filter(w=>state.wordSelectedThemes.has(w.theme));
  if(items.length===0) return;
  const count = resolveCount(state.countChoice['word'] || 10, items.length);
  const pool = weightedPick(items, state.progress.stats, count).map(it=>({
    kr: it.kr, accept: it.roman, meaning: it.meaning, note:null, statIds:[it.id]
  }));
  state.lastQuizType = 'word';
  launchQuiz(pool);
}
function resolveCount(choice, poolLen){
  if(choice==='all') return poolLen;
  return Math.min(Number(choice), poolLen);
}
function launchQuiz(pool){
  state.quiz = {pool, idx:0, answered:false, lastCorrect:null, lastInput:'', score:0, answers:[], startTime: Date.now()};
  state.screen = 'quiz';
  render();
}
function endQuizNow(){
  const q = state.quiz;
  if(!q) return;
  if(q.answers.length === 0){
    state.screen = 'home';
    render();
    return;
  }
  finishQuizSession(q);
  state.screen = 'result';
  render();
}

function renderQuiz(){
  const q = state.quiz;
  const item = q.pool[q.idx];
  const isLong = item.kr.length > 3;
  const inputClass = q.answered ? (q.lastCorrect ? 'ans-correct' : 'ans-wrong') : '';
  const cardClass = q.answered ? (q.lastCorrect ? 'flash-correct' : 'flash-wrong') : '';

  let meaningLine = '';
  if(q.answered && item.meaning) meaningLine = item.meaning;
  else if(q.answered && item.note) meaningLine = item.note;

  let feedback = '';
  if(q.answered){
    feedback = q.lastCorrect
      ? `<div class="feedback-line correct">正解！</div>`
      : `<div class="feedback-line wrong">正解: ${escapeHtml(item.accept[0])}</div>`;
  }

  return `
  <div class="section-topbar"><span class="back-link" id="btnEndQuiz">クイズを終わる</span></div>
  <div class="quiz-progress">${q.idx+1} / ${q.pool.length} ・ 正解 ${q.score}</div>
  <div class="quiz-card ${cardClass}">
    <div class="quiz-kr ${isLong?'long':''}">${item.kr}</div>
    <div class="quiz-meaning">${meaningLine}</div>
    <input type="text" id="answerInput" class="answer-input ${inputClass}" placeholder="ローマ字で入力"
      autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="${q.answered?'next':'done'}"
      ${q.answered?'disabled':''} value="${q.answered?escapeHtml(q.lastInput):''}">
    ${feedback}
    ${q.answered ? `<button class="sound-btn" id="btnReplaySound">🔊 もう一度聞く</button>` : ''}
    <div class="quiz-actions">
      ${q.answered
        ? `<button class="btn btn-primary" id="btnNext">${q.idx+1 < q.pool.length ? '次へ' : '結果を見る'}</button>`
        : `<button class="btn btn-primary" id="btnSubmit">答える</button>`}
    </div>
  </div>`;
}

function submitAnswer(){
  const q = state.quiz;
  if(q.answered) return;
  const input = document.getElementById('answerInput');
  const val = input ? input.value : '';
  const item = q.pool[q.idx];
  const correct = isCorrectAnswer(item.accept, val);
  q.answered = true;
  q.lastCorrect = correct;
  q.lastInput = val;
  if(correct) q.score++;
  q.answers.push({kr:item.kr, meaning:item.meaning, input:val, correct, expected:item.accept[0], statIds:item.statIds||[]});
  render();
  speakKorean(item.kr);
  const nextBtn = document.getElementById('btnNext');
  if(nextBtn) nextBtn.focus();
}
function nextQuestion(){
  const q = state.quiz;
  if(q.idx+1 < q.pool.length){
    q.idx++; q.answered=false; q.lastCorrect=null; q.lastInput='';
    render();
  }else{
    finishQuizSession(q);
    state.screen = 'result';
    render();
  }
}

/* ============================== RESULT ============================== */
function renderResult(){
  const q = state.quiz;
  const rows = q.answers.map((a,i)=>{
    return `<div class="review-row ${a.correct?'':'wrong'}">
      <span class="mark">${a.correct?'⭕':'❌'}</span>
      <span class="rkr">${a.kr}</span>
      <span class="rmeta">${a.correct ? '' : `あなた: <b>${escapeHtml(a.input||'(未回答)')}</b> → 正解: <b>${escapeHtml(a.expected)}</b>`}${a.meaning?` ・ ${a.meaning}`:''}</span>
      <button class="review-sound-btn" data-speak-idx="${i}" title="発音を聞く">🔊</button>
    </div>`;
  }).join('');

  return `
  <div class="result-shell"><div class="card">
    <div class="score-hero">
      <div class="num">${q.score} / ${q.answers.length}</div>
      <div class="lbl">正解</div>
    </div>
    <div class="review-list">${rows}</div>
    <div class="footer-actions">
      <button class="btn btn-primary" id="btnRetry" style="flex:1;">もう一度</button>
      <button class="btn" id="btnBackHome" style="flex:1;">ホームに戻る</button>
    </div>
  </div></div>`;
}

/* ============================== EVENT WIRING ============================== */
function wireCommon(){
  const dismissErrBtn = document.getElementById('btnDismissSaveError');
  if(dismissErrBtn) dismissErrBtn.addEventListener('click', ()=>{ state.saveErrorDismissed = true; render(); });

  const resetBtn = document.getElementById('btnResetProgress');
  if(resetBtn) resetBtn.addEventListener('click', ()=>{ state.confirmingReset = true; render(); });
  const resetYes = document.getElementById('btnResetYes');
  if(resetYes) resetYes.addEventListener('click', resetProgress);
  const resetNo = document.getElementById('btnResetNo');
  if(resetNo) resetNo.addEventListener('click', ()=>{ state.confirmingReset = false; render(); });


  document.querySelectorAll('[data-goto]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const dest = el.getAttribute('data-goto');
      if(dest==='manage'){ state.category = el.getAttribute('data-cat'); state.screen='manage'; }
      else if(dest==='wordSelect'){ state.screen='wordSelect'; }
      render();
    });
  });

  const backHome = document.getElementById('btnBackHome');
  if(backHome) backHome.addEventListener('click', ()=>{ state.screen='home'; render(); });

  // manage screen
  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-toggle');
      state.progress.learned[id] = !state.progress.learned[id];
      scheduleSave();
      render();
    });
  });
  const checkAll = document.getElementById('btnCheckAll');
  if(checkAll) checkAll.addEventListener('click', ()=>{
    CATEGORY_META[state.category].items.forEach(it=> state.progress.learned[it.id]=true);
    saveProgress(state.progress); render();
  });
  const uncheckAll = document.getElementById('btnUncheckAll');
  if(uncheckAll) uncheckAll.addEventListener('click', ()=>{
    CATEGORY_META[state.category].items.forEach(it=> state.progress.learned[it.id]=false);
    saveProgress(state.progress); render();
  });

  // count selector (word theme quiz only, now that manage screens use format instead)
  document.querySelectorAll('[data-count]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const raw = el.getAttribute('data-count');
      state.countChoice['word'] = raw==='all' ? 'all' : Number(raw);
      render();
    });
  });
  // format selector (manage screens: 文字のみ／単語)
  document.querySelectorAll('[data-format]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.formatChoice[state.category] = el.getAttribute('data-format');
      render();
    });
  });

  const startQuizBtn = document.getElementById('btnStartQuiz');
  if(startQuizBtn) startQuizBtn.addEventListener('click', ()=> startCharacterQuiz(state.category));
  const startWordBtn = document.getElementById('btnStartWord');
  if(startWordBtn) startWordBtn.addEventListener('click', startWordQuiz);

  document.querySelectorAll('[data-theme]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const t = el.getAttribute('data-theme');
      if(state.wordSelectedThemes.has(t)) state.wordSelectedThemes.delete(t);
      else state.wordSelectedThemes.add(t);
      render();
    });
  });

  // quiz screen
  const submitBtn = document.getElementById('btnSubmit');
  if(submitBtn) submitBtn.addEventListener('click', submitAnswer);
  const answerInput = document.getElementById('answerInput');
  if(answerInput){
    answerInput.focus();
    // On mobile, the keyboard can cover the input/button. Nudge it into view
    // once the keyboard has started animating in.
    setTimeout(()=>{
      answerInput.scrollIntoView({block: 'center', behavior: 'smooth'});
    }, 300);
  }
  const nextBtn = document.getElementById('btnNext');
  if(nextBtn) nextBtn.addEventListener('click', nextQuestion);
  const replayBtn = document.getElementById('btnReplaySound');
  if(replayBtn) replayBtn.addEventListener('click', ()=>{
    const q = state.quiz; if(q) speakKorean(q.pool[q.idx].kr);
  });
  const endQuizBtn = document.getElementById('btnEndQuiz');
  if(endQuizBtn) endQuizBtn.addEventListener('click', endQuizNow);

  // result screen
  const retryBtn = document.getElementById('btnRetry');
  if(retryBtn) retryBtn.addEventListener('click', ()=>{
    if(state.lastQuizType==='word') startWordQuiz();
    else if(state.lastQuizType==='character') startCharacterQuiz(state.lastQuizCategory);
  });
  document.querySelectorAll('[data-speak-idx]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const i = Number(el.getAttribute('data-speak-idx'));
      const a = state.quiz && state.quiz.answers[i];
      if(a) speakKorean(a.kr);
    });
  });
}

/* ============================== KEYBOARD FLOW ============================== */
// Single global handler (attached once) so Enter both submits and advances,
// without stacking duplicate listeners on every re-render.
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  if(state.screen !== 'quiz' || !state.quiz) return;
  e.preventDefault();
  if(state.quiz.answered) nextQuestion();
  else submitAnswer();
});

init();
</script>
</body>
</html>
